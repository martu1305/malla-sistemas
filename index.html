<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Malla interactiva</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1 id="titulo"></h1>
      <p id="subtitulo"></p>
    </div>
    <div class="progreso">
      <div class="barra"><div id="barra-fill"></div></div>
      <span id="progreso-texto"></span>
    </div>
  </header>

  <div class="leyenda">
    <span><i class="dot aprobada"></i> Aprobada</span>
    <span><i class="dot disponible"></i> Disponible</span>
    <span><i class="dot bloqueada"></i> Bloqueada</span>
    <button id="reset">Reiniciar</button>
  </div>

  <main id="malla"></main>
  <div id="toast" role="status"></div>

  <script src="materias.js"></script>
  <script src="app.js"></script>
</body>
</html>
